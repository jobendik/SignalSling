function clone(o){return JSON.parse(JSON.stringify(o))}function rnd(seed0){let s=seed0>>>0;return()=>((s=(s*1664525+1013904223)>>>0)/4294967296)}
function makeEndless(s0){const r=rnd(s0),n=4+Math.floor(r()*3),nodes=[],links=[];for(let i=0;i<n;i++){let t=i/(n-1);nodes.push({x:130+t*700+(r()-.5)*55,y:145+r()*250,r:42+r()*18,s:2+r()*1.15,d:r()>.5?1:-1,role:i===0?'source':i===n-1?'terminal':r()>.76?'repeater':undefined,decay:r()>.76?8.8:undefined,move:r()>.72&&i>0?{x1:130+t*700-35,y1:130+r()*260,x2:130+t*700+35,y2:130+r()*260,period:3+r()*2.2,phase:r()}:undefined});if(i>0)links.push([i-1,i]);if(i>1&&r()>.68)links.push([i-2,i])}const hazards=[],bumpers=[],fields=[];if(r()>.35)hazards.push({type:'circle',x:390+r()*230,y:180+r()*180,r:16+r()*16});if(r()>.55)hazards.push({type:'rect',x:450+r()*120,y:220+r()*80,w:28+r()*26,h:72+r()*70});if(r()>.5)bumpers.push({x:240+r()*520,y:400+r()*50,r:19+r()*8,power:330+r()*200});if(r()>.6)fields.push({x:365+r()*250,y:220+r()*120,r:80+r()*60,strength:r()>.5?470:-410});return{name:`Endless Relay ${s0}`,g:240+r()*90,decay:6.3+r()*2.5,source:0,coreLinks:[n-1],coreMode:'any',nodes,links,core:{x:845,y:120+r()*280,r:29},shards:[{x:250+r()*540,y:70+r()*390,r:10}],walls:[{x:58,y:464,w:844,h:18},{x:58,y:60,w:18,h:422},{x:884,y:60,w:18,h:422}],hazards,bumpers,fields,portals:[]}}
function resize(){dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(innerWidth/W,innerHeight/H);ox=(innerWidth-W*scale)/2;oy=(innerHeight-H*scale)/2}
function sound(type){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audio){const ac=new AC(),master=ac.createGain();master.gain.value=.18;master.connect(ac.destination);audio={ac,master}}if(audio.ac.state==='suspended')audio.ac.resume();const now=audio.ac.currentTime,o=audio.ac.createOscillator(),g=audio.ac.createGain();o.connect(g);g.connect(audio.master);let f0=240,f1=160,d=.12,w='sine',v=.38;if(type==='release'){f0=180;f1=460;d=.09;w='triangle'}if(type==='latch'){f0=620;f1=360;d=.13}if(type==='activate'){f0=480;f1=900;d=.18;w='triangle';v=.3}if(type==='core'){f0=360;f1=1140;d=.34;v=.34}if(type==='shard'){f0=680;f1=1280;d=.18;w='triangle'}if(type==='death'){f0=160;f1=52;d=.28;w='sawtooth';v=.24}if(type==='win'){f0=520;f1=1040;d=.42}if(type==='bumper'){f0=120;f1=620;d=.12;w='square';v=.28}o.type=w;o.frequency.setValueAtTime(f0,now);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),now+d);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(v,now+.012);g.gain.exponentialRampToValueAtTime(.001,now+d);o.start(now);o.stop(now+d+.02)}
function load(i,useEndless=false){endless=useEndless;level=endless?makeEndless(seed):clone(LEVELS[i%LEVELS.length]);for(const n of level.nodes){n.baseX=n.x;n.baseY=n.y;n.px=n.x;n.py=n.y;n.vx=0;n.vy=0}Object.assign(S,{mode:'attached',t:0,attached:level.source||0,prev:-1,angle:-Math.PI/2,releaseT:-999,coreOpen:false,shake:0,shards:0,totalShards:level.shards.length,won:false,slow:0,started:false,lockCd:0});S.energy=level.nodes.map(()=>0);S.connected=level.nodes.map(()=>false);S.edges=new Set();S.particles.length=0;S.trail.length=0;for(const sh of level.shards)sh.got=false;for(const p of level.portals)p.cool=0;activate(S.attached,true);sync();network(true);hud();toast(level.name,(level.coreMode==='all'?'Activate both terminal branches':'Build one live relay path')+' and reach the core before relays fade.',2.6)}

function activate(i,silent=false){const was=!active(i);S.energy[i]=maxEnergy(i);if(!silent&&was){const n=level.nodes[i];burst(n.x,n.y,nodeColor(n,true),24,210);sound('activate')}}
function network(initial=false){const was=S.coreOpen,conn=level.nodes.map(()=>false),q=[level.source||0];conn[q[0]]=true;while(q.length){const u=q.shift();for(const [a,b] of level.links){if(a!==u&&b!==u)continue;const v=a===u?b:a;if(!conn[v]&&active(u)&&active(v)){conn[v]=true;q.push(v)}}}S.connected=conn;S.edges.clear();level.links.forEach(([a,b],i)=>{if(conn[a]&&conn[b]&&active(a)&&active(b))S.edges.add(i)});S.coreOpen=level.coreMode==='all'?level.coreLinks.every(i=>conn[i]&&active(i)):level.coreLinks.some(i=>conn[i]&&active(i));if(!initial&&S.coreOpen&&!was){burst(level.core.x,level.core.y,'#7dffb1',44,260);sound('core');toast('Core unlocked','Now sling into the core before the chain fades.',1.35)}}

function die(txt='Signal lost'){if(zen){S.p.vx*=-.35;S.p.vy*=-.35;S.shake=7;burst(S.p.x,S.p.y,'#ff4f73',24,180);sound('death');return}S.mode='dead';S.shake=10;burst(S.p.x,S.p.y,'#ff4f73',34,240);sound('death');toast(txt,'Tap to restart instantly.',1.05)}
function win(){if(S.won)return;S.won=true;S.mode='won';S.shake=9;burst(level.core.x,level.core.y,'#ffbd72',80,370);sound('win');toast('Signal secured',`${S.t.toFixed(2)} • shards ${S.shards}/${S.totalShards}. Tap for next.`,99)}
function action(){if(S.mode==='attached')release();else if(S.mode==='dead')load(levelIndex,endless);else if(S.mode==='won')nextLevel()}function nextLevel(){if(endless){seed++;load(levelIndex,true);return}levelIndex=(levelIndex+1)%LEVELS.length;load(levelIndex,false)}
function update(dt){dt=Math.min(dt,1/30);if(S.slow>0){S.slow-=dt;dt*=.38}if(msg>0){msg-=dt;if(msg<=0)ui.toast.classList.remove('show')}S.lockCd=Math.max(0,S.lockCd-dt);if(S.mode!=='dead'&&S.mode!=='won'&&S.started)S.t+=dt;moveNodes(S.t,dt);decay(dt);for(const p of level.portals)p.cool=Math.max(0,p.cool-dt);if(S.mode==='attached'){const n=level.nodes[S.attached];S.angle+=n.s*n.d*dt;activate(S.attached,true);sync();S.trail.push({x:S.p.x,y:S.p.y,life:.42})}if(S.mode==='flying')physics(dt);network();particles(dt);trail(dt);S.shake=Math.max(0,S.shake-dt*18);hud()}
function moveNodes(t,dt){for(const n of level.nodes){n.px=n.x;n.py=n.y;if(n.move){const m=n.move,s=(Math.sin(((t/m.period)+m.phase)*TAU)+1)/2,e=s*s*(3-2*s);n.x=m.x1+(m.x2-m.x1)*e;n.y=m.y1+(m.y2-m.y1)*e}else{n.x=n.baseX;n.y=n.baseY}n.vx=(n.x-n.px)/Math.max(.0001,dt);n.vy=(n.y-n.py)/Math.max(.0001,dt)}}
function decay(dt){level.nodes.forEach((n,i)=>{if(n.role==='source')S.energy[i]=Infinity;else if(S.mode==='attached'&&S.attached===i)S.energy[i]=maxEnergy(i);else S.energy[i]=Math.max(0,S.energy[i]-dt)})}
function physics(dt){const p=S.p;p.vy+=level.g*dt;for(const f of level.fields){const dx=f.x-p.x,dy=f.y-p.y,d=Math.hypot(dx,dy);if(d<f.r&&d>1){const q=(1-d/f.r)**2,nn=norm(dx,dy),force=Math.abs(f.strength)*q*(f.strength>=0?1:-1);p.vx+=nn.x*force*dt;p.vy+=nn.y*force*dt}}p.vx*=Math.pow(DRAG,dt*60);p.vy*=Math.pow(DRAG,dt*60);let sp=Math.hypot(p.vx,p.vy);if(sp>MAX){p.vx*=MAX/sp;p.vy*=MAX/sp}p.x+=p.vx*dt;p.y+=p.vy*dt;S.trail.push({x:p.x,y:p.y,life:.64});collideWalls();bumpers();portals();shards();hazards();latch();core();if(p.x<-140||p.x>W+140||p.y<-180||p.y>H+180)die('Signal packet lost')}

function reflect(nx,ny,rest=BOUNCE){const p=S.p,d=p.vx*nx+p.vy*ny;p.vx=(p.vx-(1+rest)*d*nx)*.985;p.vy=(p.vy-(1+rest)*d*ny)*.985}
function bumpers(){const p=S.p;for(const b of level.bumpers){const dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy);if(d<b.r+PR){const n=norm(dx,dy);p.x=b.x+n.x*(b.r+PR+1);p.y=b.y+n.y*(b.r+PR+1);reflect(n.x,n.y,1.05);p.vx+=n.x*b.power;p.vy+=n.y*b.power;S.shake=Math.max(S.shake,5);burst(p.x,p.y,'#ffbd72',20,260);sound('bumper')}}}
function portals(){const p=S.p;for(const po of level.portals){if(po.cool>0)continue;const da=dist(p.x,p.y,po.a.x,po.a.y),db=dist(p.x,p.y,po.b.x,po.b.y);if(da<po.a.r+PR)tele(po,po.b);else if(db<po.b.r+PR)tele(po,po.a)}}function tele(po,to){const p=S.p,sp=Math.max(420,Math.hypot(p.vx,p.vy)),n=norm(p.vx,p.vy||-1);burst(p.x,p.y,'#b579ff',18,180);p.x=to.x+n.x*(to.r+PR+4);p.y=to.y+n.y*(to.r+PR+4);p.vx=n.x*sp;p.vy=n.y*sp;po.cool=.5;burst(p.x,p.y,'#b579ff',18,220)}
function shards(){const p=S.p;for(const s of level.shards)if(!s.got&&dist(p.x,p.y,s.x,s.y)<s.r+PR+4){s.got=true;S.shards++;S.slow=.1;burst(s.x,s.y,'#ff61c7',28,240);sound('shard')}}
function hazards(){const p=S.p;for(const h of level.hazards){if(h.type==='circle'){if(dist(p.x,p.y,h.x,h.y)<h.r+PR-1)die('Packet corrupted')}else{const cx=clamp(p.x,h.x,h.x+h.w),cy=clamp(p.y,h.y,h.y+h.h);if(dist(p.x,p.y,cx,cy)<PR)die('Packet corrupted')}}}
function latch(){const p=S.p;for(let i=0;i<level.nodes.length;i++){if(i===S.prev&&S.t-S.releaseT<.24)continue;const n=level.nodes[i],d=dist(p.x,p.y,n.x,n.y),rd=Math.abs(d-n.r);if(rd<LATCH){const rad=norm(p.x-n.x,p.y-n.y),inward=-(p.vx*rad.x+p.vy*rad.y),sp=Math.hypot(p.vx,p.vy);if(sp>80&&(inward>-260||rd<8)){attach(i);return}}}}
function core(){const p=S.p,co=level.core,d=dist(p.x,p.y,co.x,co.y);if(d<co.r+PR){if(S.coreOpen)win();else{const n=norm(p.x-co.x,p.y-co.y);p.x=co.x+n.x*(co.r+PR+1);p.y=co.y+n.y*(co.r+PR+1);reflect(n.x,n.y,.88);p.vx+=n.x*90;p.vy+=n.y*90;S.shake=Math.max(S.shake,4.5);burst(p.x,p.y,'#ff4f73',14,180);if(S.lockCd<=0){toast('Core locked','Reconnect the live relay chain first.',1);S.lockCd=1.5}}}}
function particles(dt){for(let i=S.particles.length-1;i>=0;i--){const p=S.particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.965,dt*60);p.vy*=Math.pow(.965,dt*60);p.vy+=40*dt;if(p.life<=0)S.particles.splice(i,1)}}function trail(dt){for(let i=S.trail.length-1;i>=0;i--){S.trail[i].life-=dt;if(S.trail[i].life<=0)S.trail.splice(i,1)}if(S.trail.length>76)S.trail.splice(0,S.trail.length-76)}
function draw(){x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,innerWidth,innerHeight);bg();x.save();const sh=S.shake,sx=sh?(Math.random()-.5)*sh:0,sy=sh?(Math.random()-.5)*sh:0;x.translate(ox+sx,oy+sy);x.scale(scale,scale);world();x.restore()}
function bg(){let g=x.createLinearGradient(0,0,0,innerHeight);g.addColorStop(0,'#091126');g.addColorStop(1,'#030612');x.fillStyle=g;x.fillRect(0,0,innerWidth,innerHeight);x.save();x.globalAlpha=.3;x.strokeStyle='rgba(99,247,255,.08)';let grid=32*scale;for(let xx=ox%grid;xx<innerWidth;xx+=grid){line(xx,0,xx,innerHeight)}for(let yy=oy%grid;yy<innerHeight;yy+=grid){line(0,yy,innerWidth,yy)}x.restore()}
function world(){fields();walls();portalsDraw();links();coreLinks();nodes();coreDraw();shardsDraw();bumpersDraw();hazardsDraw();trajectory();trailDraw();player();particleDraw();labels()}
function links(){x.save();x.lineCap='round';level.links.forEach(([a,b],i)=>{const A=level.nodes[a],B=level.nodes[b],on=S.edges.has(i),part=active(a)||active(b);x.lineWidth=on?4.2:2;x.strokeStyle=on?'rgba(99,247,255,.8)':part?'rgba(99,247,255,.2)':'rgba(145,224,255,.10)';x.setLineDash(on?[]:[5,12]);line(A.x,A.y,B.x,B.y);if(on){glow('rgba(99,247,255,.42)',16,()=>line(A.x,A.y,B.x,B.y));packet(A.x,A.y,B.x,B.y,i)}});x.setLineDash([]);x.restore()}
function coreLinks(){for(const i of level.coreLinks){const n=level.nodes[i],on=S.connected[i]&&active(i);x.lineWidth=on?3.8:1.6;x.strokeStyle=on?(S.coreOpen?'rgba(125,255,177,.78)':'rgba(99,247,255,.48)'):'rgba(255,189,114,.14)';x.setLineDash(on?[]:[4,10]);line(n.x,n.y,level.core.x,level.core.y);if(on)glow(S.coreOpen?'rgba(125,255,177,.46)':'rgba(99,247,255,.25)',16,()=>line(n.x,n.y,level.core.x,level.core.y))}x.setLineDash([])}
function nodes(){level.nodes.forEach((n,i)=>{const on=active(i),conn=S.connected[i]&&on,att=S.mode==='attached'&&S.attached===i,col=nodeColor(n,conn);x.save();x.translate(n.x,n.y);x.lineWidth=att?5:conn?4:2.5;x.strokeStyle=on?col:'rgba(145,224,255,.35)';circle(0,0,n.r,'stroke');glow(on?rgba(col,att?.55:.32):'rgba(99,247,255,.10)',att?24:14,()=>circle(0,0,n.r,'stroke'));x.lineWidth=1.4;x.strokeStyle='rgba(255,255,255,.18)';x.setLineDash([4,10]);circle(0,0,n.r-10,'stroke');x.setLineDash([]);decayArc(i,n);glyph(n);let a=performance.now()*.001*n.s*n.d+i;chev(Math.cos(a)*n.r,Math.sin(a)*n.r,a+(n.d>0?Math.PI/2:-Math.PI/2),att?'#fff':col,att?1:.72);x.restore()})}
function decayArc(i,n){if(n.role==='source'){x.strokeStyle='rgba(125,255,177,.92)';x.lineWidth=3;circle(0,0,n.r+8,'stroke');return}let pct=clamp(S.energy[i]/maxEnergy(i),0,1);if(pct<=0)return;x.strokeStyle=pct<.25?'rgba(255,79,115,.95)':'rgba(125,255,177,.90)';x.lineWidth=4;x.beginPath();x.arc(0,0,n.r+8,-Math.PI/2,-Math.PI/2+TAU*pct);x.stroke()}
function glyph(n){x.save();if(n.role==='source'){x.fillStyle='rgba(125,255,177,.2)';x.strokeStyle='rgba(125,255,177,.9)';x.lineWidth=1.8;x.beginPath();x.moveTo(0,-11);x.lineTo(11,0);x.lineTo(0,11);x.lineTo(-11,0);x.closePath();x.fill();x.stroke()}else if(n.role==='repeater'){x.strokeStyle='rgba(255,97,199,.92)';x.lineWidth=2;circle(0,0,10,'stroke');circle(0,0,4,'stroke')}else if(n.role==='terminal'){x.strokeStyle='rgba(255,189,114,.92)';x.lineWidth=2;x.beginPath();x.moveTo(-9,-7);x.lineTo(9,0);x.lineTo(-9,7);x.stroke()}x.restore()}
function coreDraw(){const co=level.core,t=performance.now()*.003,on=S.coreOpen;x.save();x.translate(co.x,co.y);x.rotate(t*(on?1:.45));x.fillStyle=on?'rgba(125,255,177,.16)':'rgba(255,79,115,.12)';x.strokeStyle=on?'#7dffb1':'#ff4f73';x.lineWidth=on?4:2.4;poly(6,co.r);x.fill();x.stroke();glow(on?'rgba(125,255,177,.55)':'rgba(255,79,115,.3)',on?26:14,()=>{poly(6,co.r);x.stroke()});x.rotate(-t*1.7);x.strokeStyle=on?'rgba(255,255,255,.8)':'rgba(255,189,114,.35)';x.lineWidth=1.5;poly(3,co.r*.48);x.stroke();if(!on){x.rotate(t*2.1);x.strokeStyle='rgba(255,79,115,.55)';x.lineWidth=2;x.beginPath();x.moveTo(-9,-2);x.lineTo(-9,-9);x.quadraticCurveTo(0,-18,9,-9);x.lineTo(9,-2);x.stroke();round(-13,-2,26,18,5);x.stroke()}x.restore()}
function shardsDraw(){for(const s of level.shards){if(s.got)continue;let t=performance.now()*.004;x.save();x.translate(s.x,s.y+Math.sin(t+s.x)*2.5);x.rotate(t);x.fillStyle='rgba(255,97,199,.22)';x.strokeStyle='rgba(255,97,199,.92)';x.lineWidth=2;poly(5,s.r);x.fill();x.stroke();glow('rgba(255,97,199,.45)',16,()=>circle(0,0,s.r,'stroke'));x.restore()}}
function walls(){for(const w of level.walls){round(w.x,w.y,w.w,w.h,8);x.fillStyle='rgba(150,208,255,.09)';x.fill();x.lineWidth=1.5;x.strokeStyle='rgba(145,224,255,.26)';x.stroke()}}
function hazardsDraw(){for(const h of level.hazards){x.save();x.strokeStyle='rgba(255,79,115,.95)';x.fillStyle='rgba(255,79,115,.18)';x.lineWidth=2.2;if(h.type==='circle'){circle(h.x,h.y,h.r,'fillstroke');for(let i=0;i<8;i++){let a=i/8*TAU+performance.now()*.001;line(h.x+Math.cos(a)*(h.r+3),h.y+Math.sin(a)*(h.r+3),h.x+Math.cos(a)*(h.r+13),h.y+Math.sin(a)*(h.r+13))}}else{round(h.x,h.y,h.w,h.h,8);x.fill();x.stroke()}x.restore()}}
function bumpersDraw(){for(const b of level.bumpers){let t=performance.now()*.005;x.save();x.translate(b.x,b.y);x.rotate(t);x.strokeStyle='rgba(255,189,114,.94)';x.fillStyle='rgba(255,189,114,.14)';x.lineWidth=2.5;circle(0,0,b.r,'fillstroke');for(let i=0;i<4;i++){x.rotate(Math.PI/2);line(b.r-8,0,b.r+8,0)}x.restore()}}
function fields(){for(const f of level.fields){let pull=f.strength>=0;x.save();x.strokeStyle=pull?'rgba(111,140,255,.27)':'rgba(181,121,255,.28)';x.fillStyle=pull?'rgba(111,140,255,.055)':'rgba(181,121,255,.055)';x.lineWidth=1.4;circle(f.x,f.y,f.r,'fillstroke');x.setLineDash([2,10]);for(let rr=f.r*.35;rr<f.r;rr+=24)circle(f.x,f.y,rr,'stroke');x.setLineDash([]);x.restore()}}
function portalsDraw(){for(const p of level.portals){portalNode(p.a);portalNode(p.b);x.setLineDash([6,10]);x.strokeStyle='rgba(181,121,255,.18)';x.lineWidth=1.5;line(p.a.x,p.a.y,p.b.x,p.b.y);x.setLineDash([])}}function portalNode(p){let t=performance.now()*.004;x.save();x.translate(p.x,p.y);x.rotate(t);x.strokeStyle='#b579ff';x.fillStyle='rgba(181,121,255,.1)';x.lineWidth=2;circle(0,0,p.r,'fillstroke');circle(0,0,p.r*.52,'stroke');x.restore()}
function trajectory(){if(S.mode!=='attached')return;const n=level.nodes[S.attached],tx=-Math.sin(S.angle)*n.d,ty=Math.cos(S.angle)*n.d;let px=S.p.x,py=S.p.y,vx=tx*590,vy=ty*590;x.save();x.strokeStyle='rgba(255,255,255,.28)';x.lineWidth=2;x.setLineDash([1,12]);x.beginPath();x.moveTo(px,py);for(let i=0;i<38;i++){vy+=level.g*.016;px+=vx*.016;py+=vy*.016;if(i%2===0)x.lineTo(px,py)}x.stroke();x.setLineDash([]);x.restore()}
function trailDraw(){for(let i=0;i<S.trail.length;i++){const tr=S.trail[i],a=clamp(tr.life/.64,0,1)*(i/S.trail.length);x.fillStyle=`rgba(99,247,255,${a*.22})`;circle(tr.x,tr.y,PR*(.35+a),'fill')}}
function player(){const p=S.p,sp=Math.hypot(p.vx,p.vy),sq=S.mode==='flying'?clamp(sp/760,0,1):0;x.save();x.translate(p.x,p.y);if(S.mode==='flying')x.rotate(Math.atan2(p.vy,p.vx));x.scale(1+sq*.35,1-sq*.12);x.fillStyle='#fff';x.strokeStyle='rgba(99,247,255,.95)';x.lineWidth=2.5;circle(0,0,PR,'fillstroke');glowFill('rgba(99,247,255,.58)',18,()=>circle(0,0,PR+1,'fill'));x.restore()}
function particleDraw(){x.save();x.globalCompositeOperation='lighter';for(const p of S.particles){let a=clamp(p.life/p.max,0,1);x.globalAlpha=a;x.fillStyle=p.color;circle(p.x,p.y,p.r*(.7+a),'fill')}x.globalAlpha=1;x.restore()}
function labels(){x.save();x.font='800 12px Inter,system-ui,sans-serif';x.fillStyle='rgba(237,249,255,.5)';x.textAlign='center';x.fillText(level.name,W/2,34);if(level.coreMode==='all'){x.fillStyle='rgba(255,189,114,.76)';x.fillText('Split objective: both terminal branches must be connected at the same time',W/2,55)}else if(zen){x.fillStyle='rgba(125,255,177,.72)';x.fillText('ZEN MODE: hazards bounce instead of reset',W/2,55)}x.restore()}
function packet(x1,y1,x2,y2,o){let t=(performance.now()*.00055+o*.137)%1;for(let k=0;k<2;k++){let p=(t+k*.5)%1,xx=x1+(x2-x1)*p,yy=y1+(y2-y1)*p;x.save();x.fillStyle='rgba(255,255,255,.78)';x.shadowColor='rgba(99,247,255,.85)';x.shadowBlur=13;circle(xx,yy,2.6,'fill');x.restore()}}
function burst(px,py,color,count,power){for(let i=0;i<count;i++){let a=Math.random()*TAU,s=power*(.18+Math.random()*.82);S.particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1.4+Math.random()*2.7,color,life:.34+Math.random()*.54,max:.88})}}
function hud(){ui.level.textContent=endless?`∞-${seed}`:`${levelIndex+1}/${LEVELS.length}`;ui.time.textContent=S.t.toFixed(2);ui.shards.textContent=`${S.shards}/${S.totalShards}`;const count=level.nodes.filter((_,i)=>active(i)).length;if(S.coreOpen){ui.chain.textContent='Open';ui.chain.className='open'}else if(count>1){ui.chain.textContent='Live';ui.chain.className='live'}else{ui.chain.textContent='Closed';ui.chain.className='closed'}ui.zen.textContent=`Zen: ${zen?'On':'Off'}`}
function toast(a,b,t=2){ui.toast.innerHTML=`<h1>${a}</h1><p>${b}</p>`;ui.toast.classList.add('show');msg=t}
function nodeColor(n){if(n.role==='source')return'#7dffb1';if(n.role==='terminal')return'#ffbd72';if(n.role==='repeater')return'#ff61c7';return'#63f7ff'}function rgba(hex,a){const h=hex.slice(1),r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return`rgba(${r},${g},${b},${a})`}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b,c,d){return Math.hypot(a-c,b-d)}function norm(a,b){let m=Math.hypot(a,b)||1;return{x:a/m,y:b/m}}function line(a,b,c,d){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}function circle(a,b,r,mode){x.beginPath();x.arc(a,b,r,0,TAU);if(mode.includes('fill'))x.fill();if(mode.includes('stroke'))x.stroke()}function round(a,b,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}function poly(s,r){x.beginPath();for(let i=0;i<s;i++){let a=-Math.PI/2+i/s*TAU,px=Math.cos(a)*r,py=Math.sin(a)*r;if(i)x.lineTo(px,py);else x.moveTo(px,py)}x.closePath()}function chev(px,py,a,col,al=1){x.save();x.translate(px,py);x.rotate(a);x.globalAlpha=al;x.strokeStyle=col;x.lineWidth=2;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(-5,-4);x.lineTo(2,0);x.lineTo(-5,4);x.stroke();x.restore()}function glow(col,blur,fn){x.save();x.shadowColor=col;x.shadowBlur=blur;x.strokeStyle=col;fn();x.restore()}function glowFill(col,blur,fn){x.save();x.shadowColor=col;x.shadowBlur=blur;x.fillStyle=col;fn();x.restore()}
function frame(now){let dt=(now-last)/1000;last=now;update(dt);draw();requestAnimationFrame(frame)}
c.addEventListener('pointerdown',e=>{e.preventDefault();action()},{passive:false});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();action()}if(e.code==='KeyR')load(levelIndex,endless);if(e.code==='KeyN')nextLevel();if(e.code==='KeyZ'){zen=!zen;hud()}});ui.restart.onclick=e=>{e.stopPropagation();load(levelIndex,endless)};ui.next.onclick=e=>{e.stopPropagation();nextLevel()};ui.zen.onclick=e=>{e.stopPropagation();zen=!zen;hud()};ui.endless.onclick=e=>{e.stopPropagation();seed=1+Math.floor(Math.random()*9999);load(levelIndex,true)};addEventListener('resize',resize);resize();load(0,false);requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
})();
</script>
